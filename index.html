<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân của Đinh Hưng</title>
<style>
:root{
  --accent:#06b6d4;
  --accent2:#3b82f6;
  --text:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}

body {
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  overflow-x: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  background-color: #000;
}

#bgVideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: -2;
  object-fit: cover;
  filter: brightness(0.8);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: -1;
}

.container {
  width: min(480px, 90%);
  margin: auto;
  padding: 40px 0;
  z-index: 1;
}

.profile {
  text-align: center;
}

.avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin: auto;
  background-image: url('avatar.jpg');
  background-size: cover;
  background-position: center;
  border: 3px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
}

h1 {
  font-size: 26px;
  margin: 14px 0 4px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.badge {
  display: inline-block;
  margin-top: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 13px;
  color: #eee;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.links {
  display: grid;
  gap: 12px;
  margin: 24px auto 18px;
  width: 100%;
}

.social {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: white;
  padding: 10px 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: .25s ease;
}

.social:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.35);
}

.social span {
  font-weight: 600;
  font-size: 1em;
}

.icon-container {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  margin-right: 12px;
}

.app-icon-background {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid;
  place-items: center;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 2px 4px rgba(0, 0, 0, 0.3);
}

.app-icon-glyph {
  width: 20px;
  height: 20px;
}

.music {
  margin-top: 15px;
  padding: 14px 18px;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.music-title {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 10px;
  text-align: center;
  color: rgba(255, 255, 255, 0.9);
}

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
}

button {
  border: 0;
  color: white;
  background: rgba(255, 255, 255, 0.15);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: .2s;
}

button:hover {
  background: rgba(255, 255, 255, 0.25);
}

#playBtn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

.volume {
  width: 100px;
  accent-color: var(--accent);
  cursor: pointer;
}
</style>
</head>
<body>

<video autoplay muted loop playsinline id="bgVideo">
  <source src="bgvideo.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
  <section class="profile">
    <div class="avatar-wrap">
      <div class="avatar" id="avatar"></div>
    </div>
    <h1>Đinh Hưng</h1>
    <div class="badge">✨ Welcome to my profile</div>
  </section>

  <section class="links">
    <a class="social" href="https://www.facebook.com/inhhung.29404" target="_blank" rel="noopener">
      <div class="icon-container">
        <div class="app-icon-background">
          <svg class="app-icon-glyph" viewBox="0 0 24 24" fill="white">
            <path d="M14 14.5h3v-3h-3v-2a1 1 0 0 1 1-1h2v-3h-2c-2.209 0-4 1.791-4 4v2H9v3h3v9h2v-9z"/>
          </svg>
        </div>
      </div>
      <div><span>Facebook</span></div>
    </a>

    <a class="social" href="https://www.tiktok.com/@hwg_786" target="_blank" rel="noopener">
      <div class="icon-container">
        <div class="app-icon-background">
          <svg class="app-icon-glyph" viewBox="0 0 24 24" fill="white">
            <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002.001a2.895 2.895 0 0 1 3.183-4.51v-3.5a6.326 6.326 0 0 0-1.232-.125 6.395 6.395 0 0 0-6.393 6.393 6.39 6.39 0 0 0 6.393 6.393 6.39 6.39 0 0 0 6.392-6.393v-7.07c1.271.938 2.83 1.5 4.51 1.5v-3.418z"/>
          </svg>
        </div>
      </div>
      <div><span>TikTok</span></div>
    </a>

    <a class="social" href="https://www.instagram.com/huwgg_06" target="_blank" rel="noopener">
      <div class="icon-container">
        <div class="app-icon-background">
          <svg class="app-icon-glyph" viewBox="0 0 24 24" fill="white">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </div>
      </div>
      <div><span>Instagram</span></div>
    </a>
  </section>

  <section class="music">
    <div class="music-title">🎵 Nhạc nền: Xương Rồng</div>
    <div class="controls">
      <button id="playBtn">▶ Phát nhạc</button>
      <button id="muteBtn">🔊</button>
      <input id="volume" class="volume" type="range" min="0" max="1" step=".01" value=".55">
    </div>
  </section>
</div>

<audio id="audio" src="xuongrong.mp3" loop preload="auto"></audio>

<script>
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const volume = document.getElementById("volume");

audio.volume = 0.55;

function tryPlay() {
  audio.play().then(() => {
    playBtn.textContent = "⏸ Tạm dừng";
  }).catch(() => {
    playBtn.textContent = "▶ Phát nhạc";
  });
}

window.addEventListener("load", tryPlay);

document.addEventListener("click", () => {
  if (audio.paused) {
    tryPlay();
  }
}, { once: true });

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    audio.pause();
  } else {
    tryPlay();
  }
});

playBtn.onclick = (e) => {
  e.stopPropagation();
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸ Tạm dừng";
  } else {
    audio.pause();
    playBtn.textContent = "▶ Phát nhạc";
  }
};

audio.onplay = () => playBtn.textContent = "⏸ Tạm dừng";
audio.onpause = () => playBtn.textContent = "▶ Phát nhạc";

volume.oninput = () => audio.volume = volume.value;
muteBtn.onclick = (e) => {
  e.stopPropagation();
  audio.muted = !audio.muted;
  muteBtn.textContent = audio.muted ? "🔇" : "🔊";
};
</script>
</body>
</html>
