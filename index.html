<audio id="audio" src="xuongrong.mp3" loop preload="auto" autoplay playsinline></audio>
<script>
const audio=document.getElementById("audio"),playBtn=document.getElementById("playBtn"),muteBtn=document.getElementById("muteBtn"),volume=document.getElementById("volume");audio.volume=.55;
function tryPlay(){audio.play().then(()=>playBtn.textContent="⏸ Tạm dừng").catch(()=>playBtn.textContent="▶ Phát nhạc")}
function unlockAudio(){if(audio.paused)tryPlay()}
document.addEventListener("DOMContentLoaded",tryPlay);
window.addEventListener("load",tryPlay);
window.addEventListener("pageshow",tryPlay);
["pointerdown","keydown","touchstart"].forEach(evt=>document.addEventListener(evt,unlockAudio,{once:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tryPlay()});
playBtn.onclick=e=>{e.stopPropagation();if(audio.paused){tryPlay()}else{audio.pause();playBtn.textContent="▶ Phát nhạc"}};
audio.onplay=()=>playBtn.textContent="⏸ Tạm dừng";audio.onpause=()=>playBtn.textContent="▶ Phát nhạc";volume.oninput=()=>audio.volume=volume.value;
muteBtn.onclick=e=>{e.stopPropagation();audio.muted=!audio.muted;muteBtn.textContent=audio.muted?"🔇":"🔊"};
</script></body></html>
