.links{display:grid;gap:12px;margin:24px auto 18px;width:100%}
.social{display:flex;align-items:center;text-decoration:none;color:white;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);transition:.25s ease}

.music{margin-top:15px;padding:14px 18px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px)}
.music-title{font-weight:700;font-size:14px;margin-bottom:10px;text-align:center;color:rgba(255,255,255,.9)}
.controls{display:flex;gap:10px;justify-content:center;align-items:center}
button{border:0;color:white;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;transition:.2s}
button:hover{background:rgba(255,255,255,.25)}#playBtn{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.volume{width:100px;accent-color:var(--accent);cursor:pointer}

<section class="music"><div class="music-title">🎵 Nhạc nền: Xương Rồng</div><div class="controls"><button id="playBtn">▶ Phát nhạc</button><button id="muteBtn">🔊</button><input id="volume" class="volume" type="range" min="0" max="1" step=".01" value=".55"></div></section></div>
<audio id="audio" src="xuongrong.mp3" loop preload="auto"></audio>
<script>
const audio=document.getElementById("audio"),playBtn=document.getElementById("playBtn"),muteBtn=document.getElementById("muteBtn"),volume=document.getElementById("volume");audio.volume=.55;
function tryPlay(){audio.play().then(()=>playBtn.textContent="⏸ Tạm dừng").catch(()=>playBtn.textContent="▶ Phát nhạc")}
window.addEventListener("load",tryPlay);document.addEventListener("click",()=>{if(audio.paused)tryPlay()},{once:true});
document.addEventListener("visibilitychange",()=>{if(document.hidden)audio.pause();else tryPlay()});
playBtn.onclick=e=>{e.stopPropagation();if(audio.paused){audio.play();playBtn.textContent="⏸ Tạm dừng"}else{audio.pause();playBtn.textContent="▶ Phát nhạc"}};
audio.onplay=()=>playBtn.textContent="⏸ Tạm dừng";audio.onpause=()=>playBtn.textContent="▶ Phát nhạc";volume.oninput=()=>audio.volume=volume.value;
muteBtn.onclick=e=>{e.stopPropagation();audio.muted=!audio.muted;muteBtn.textContent=audio.muted?"🔇":"🔊"};
</script></body></html>
